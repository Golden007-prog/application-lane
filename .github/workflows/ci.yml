name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each action is pinned to the commit its release tag named when it was
# chosen: a tag can be moved to other code, a commit cannot.

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step ran to GitHub's 6-hour limit on every push (Nov 2026).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      # Some unit tests drive a headless Chromium (the config interpreter,
      # the submit capture): without it they failed and the run hung.
      - run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: node --import tsx --test --test-timeout=120000 tests/*.test.ts
      - name: Build
        run: npm run build
      - name: Chrome Web Store build
        run: npm run build -- --store
      - name: Package
        run: npm run package
      # Only the private repository has the exporter; the public one skips this.
      - name: Public export dry run
        run: |
          if [ -f scripts/export-public.mjs ]; then
            npm run export:public -- "$RUNNER_TEMP/export"
            for p in eval scripts/fixer.ts docs/private; do
              test ! -e "$RUNNER_TEMP/export/$p"
            done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: release/
          if-no-files-found: ignore

  # A few browser tests that guard what the extension promises: it never
  # submits or presses Next on its own, an edit pauses a fill, and it signs
  # and fills AI answers only as the applicant set. On every pull request
  # and push to main; the whole suite is nightly.yml.
  browser-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser smoke tests
        run: >-
          npx playwright test tests/browser/extension.spec.ts --workers 2 --grep
          "never submits|toggle choice that would submit its form is never clicked|trusted edits pause one tab|slow Next navigation pauses|only the applicant's own edits are saved as locks|self-identification date is filled|Next step and Submit press only|automatic AI filling drafts a military-service"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
